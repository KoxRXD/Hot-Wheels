<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Feliz 30 de septiembre mi amorcito <333</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0a1628;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      position: relative;
    }

    .bg-pattern {
      position: fixed;
      inset: 0;
      background-color: #0a1628;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(0, 120, 255, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(0, 80, 200, 0.08) 0%, transparent 50%);
      z-index: 0;
    }

    .bg-pattern::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%231a3a6e' fill-opacity='0.22'%3E%3Cpath d='M50 8c-7 0-12 5-12 12v7c0 2.5 1.5 4 4 4h16c2.5 0 4-1.5 4-4v-7c0-7-5-12-12-12zm-18 26c-5 0-9 3.5-9 9v35c0 5.5 4 9 9 9h36c5 0 9-3.5 9-9V43c0-5.5-4-9-9-9H32zm4 13h28v9H36v-9zm0 13h18v7H36v-7z'/%3E%3C/g%3E%3C/svg%3E");
      background-size: 90px 90px;
      opacity: 0.5;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      padding: 30px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .mensaje {
      text-align: center;
      color: #5ec8ff;
      font-size: 1.55rem;
      font-weight: 700;
      line-height: 1.35;
      text-shadow: 
        0 0 20px rgba(94, 200, 255, 0.65),
        0 0 40px rgba(94, 200, 255, 0.35);
      letter-spacing: 0.3px;
      animation: glow 2.5s ease-in-out infinite alternate;
      padding: 0 10px;
    }

    @keyframes glow {
      from { text-shadow: 0 0 15px rgba(94, 200, 255, 0.5), 0 0 30px rgba(94, 200, 255, 0.2); }
      to   { text-shadow: 0 0 28px rgba(94, 200, 255, 0.95), 0 0 55px rgba(94, 200, 255, 0.5); }
    }

    .ramo-wrapper {
      width: 100%;
      max-width: 300px;
      position: relative;
      filter: drop-shadow(0 10px 25px rgba(0, 80, 200, 0.45));
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .ramo-wrapper img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Botón de música (solo se muestra si el autoplay está bloqueado) */
    .music-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0077ff, #00c6ff);
      border: none;
      color: white;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 150, 255, 0.45);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .music-btn:active {
      transform: scale(0.92);
    }

    .music-btn.hidden {
      display: none;
    }

    .heart {
      position: fixed;
      font-size: 17px;
      opacity: 0.5;
      animation: rise 9s linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes rise {
      0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.5; }
      90%  { opacity: 0.25; }
      100% { transform: translateY(-80px) rotate(360deg); opacity: 0; }
    }

    @media (max-width: 400px) {
      .mensaje { font-size: 1.35rem; }
      .ramo-wrapper { max-width: 270px; }
    }
  </style>
</head>

  <!-- Audio -->
  <audio id="musica" loop preload="auto">
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <!-- Botón flotante por si el navegador bloquea el autoplay -->
  <button class="music-btn" id="musicBtn" title="Reproducir música">🎵</button>

  <script>
    const audio = document.getElementById('musica');
    const btn = document.getElementById('musicBtn');
    let playing = false;

    // Intentar autoplay al cargar
    function intentarPlay() {
      audio.volume = 0.7;
      const promise = audio.play();
      if (promise !== undefined) {
        promise.then(() => {
          playing = true;
          btn.classList.add('hidden'); // se reproduce solo, ocultamos botón
        }).catch(() => {
          // Autoplay bloqueado (normal en celulares) → mostramos el botón
          btn.classList.remove('hidden');
        });
      }
    }

    // Al tocar cualquier parte de la página también intenta reproducir
    document.body.addEventListener('click', function once() {
      if (!playing) {
        audio.play().then(() => {
          playing = true;
          btn.classList.add('hidden');
        }).catch(() => {});
      }
      document.body.removeEventListener('click', once);
    }, { once: true });

    // Botón de música
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (playing) {
        audio.pause();
        playing = false;
        btn.textContent = '🎵';
      } else {
        audio.play().then(() => {
          playing = true;
          btn.textContent = '⏸️';
        });
      }
    });

    // Intentar al cargar
    window.addEventListener('load', intentarPlay);
  </script>
